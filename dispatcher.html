<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reflex - Dispatcher</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dispatcher.css') }}">
</head>
<body>
    <header>
        <h1>Reflex</h1>
        <p>Dispatcher Dashboard</p>
    </header>

    <main>
        <section>
            <h2>Who are you?</h2>
            <p class="description">
                No login system yet (see trade-off log) — enter your
                Dispatcher ID before assigning deliveries.
            </p>
            <input type="number" id="dispatcherIdInput" placeholder="Your Dispatcher ID, e.g. 2">
        </section>

        <section>
            <h2>Open Delivery Requests</h2>
            <button onclick="loadOpenDeliveries()">Refresh List</button>
            <div id="deliveries"></div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/dispatcher.js') }}"></script>
</body>
</html>
